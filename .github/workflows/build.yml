name: Build

# CI gate for spice-probe. Builds and runs the test suite, on every pull request and push to main.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test spice-probe
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build
        run: ./mvnw --batch-mode verify
